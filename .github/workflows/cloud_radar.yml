name: AI Market Decision - Cloud Radar V7.5

on:
  schedule:
    # V7.5 no longer asks GitHub to fire ~46 cron events per day.
    # GitHub only starts three blocks; the Python daemon owns the 15-minute
    # cadence inside each running block.
    - cron: '7 4 * * 1-5'
      timezone: 'America/New_York'
    - cron: '37 9 * * 1-5'
      timezone: 'America/New_York'
    - cron: '5 16 * * 1-5'
      timezone: 'America/New_York'

  workflow_dispatch:
    inputs:
      mode:
        description: 'once = one scan; window = internal 15-minute loop'
        required: true
        default: 'once'
        type: choice
        options:
          - once
          - window
      force_run:
        description: 'Forza una scansione anche fuori dalla finestra live'
        required: false
        default: true
        type: boolean
      send_summary:
        description: 'Invia un riepilogo Telegram di test'
        required: false
        default: true
        type: boolean

concurrency:
  group: ai-market-cloud-radar-v75
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: '1'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MARKET_DB_PATH: ${{ github.workspace }}/.radar_state/radar.db
      MODEL_CACHE_DIR: ${{ github.workspace }}/.radar_state/models
      RADAR_STATE_DIR: ${{ github.workspace }}/.radar_state

      RADAR_TICKERS: ${{ vars.RADAR_TICKERS }}
      RADAR_ASSETS: ${{ vars.RADAR_ASSETS }}
      RADAR_WORKERS: ${{ vars.RADAR_WORKERS }}
      RADAR_ALERT_SCORE: ${{ vars.RADAR_ALERT_SCORE }}
      RADAR_NOTIFY_WATCH: ${{ vars.RADAR_NOTIFY_WATCH }}
      RADAR_MAX_ALERTS: ${{ vars.RADAR_MAX_ALERTS }}
      RADAR_ENTRY_CUTOFF_ET: ${{ vars.RADAR_ENTRY_CUTOFF_ET }}
      RADAR_CAPITAL: ${{ vars.RADAR_CAPITAL }}
      RADAR_RISK_PCT: ${{ vars.RADAR_RISK_PCT }}

      RADAR_INTERVAL_MINUTES: '15'
      RADAR_DAEMON_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'window' }}
      RADAR_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run && 'true' || 'false' }}
      RADAR_SEND_SUMMARY: ${{ github.event_name == 'workflow_dispatch' && inputs.send_summary && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_worker.txt

      - name: Restore radar state, models and paper ledger
        uses: actions/cache/restore@v4
        with:
          path: .radar_state
          key: radar-v75-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-v75-${{ runner.os }}-
            radar-state-${{ runner.os }}-

      - name: Prepare state directory
        run: mkdir -p .radar_state/models

      - name: Install worker dependencies
        run: python -m pip install -r requirements_worker.txt

      - name: Validate Telegram secrets
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID in GitHub repository secrets."
            exit 2
          fi

      - name: Run V7.5 radar scheduler
        run: python radar_daemon.py

      - name: Upload radar P/L ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .radar_state/trade_ledger.csv
            .radar_state/signal_events.csv
            .radar_state/performance_summary.json
            .radar_state/last_run.json
          if-no-files-found: warn
          retention-days: 30

      - name: Save radar state, models and paper ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .radar_state
          key: radar-v75-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
