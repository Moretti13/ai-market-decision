name: AI Market Decision - Cloud Radar

on:
  schedule:
    # Primary + backup trigger for each logical 15-minute slot.
    # The database slot guard lets the backup recover a failed/delayed primary
    # without running the scanner twice.
    - cron: '7,22,37,52 4-15 * * 1-5'
      timezone: 'America/New_York'
    - cron: '12,27,42,57 4-15 * * 1-5'
      timezone: 'America/New_York'
    - cron: '7 16 * * 1-5'
      timezone: 'America/New_York'
    - cron: '12 16 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Esegui diagnostica anche fuori da premarket/sessione regolare'
        required: false
        default: true
        type: boolean
      send_summary:
        description: 'Invia un riepilogo Telegram di test'
        required: false
        default: true
        type: boolean

concurrency:
  group: ai-market-cloud-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONUNBUFFERED: '1'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MODEL_CACHE_DIR: ${{ github.workspace }}/.radar_state/models
      RADAR_STATE_DIR: ${{ github.workspace }}/.radar_state
      GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
      RADAR_REQUIRE_PERSISTENT_DB: 'true'
      RADAR_TICKERS: ${{ vars.RADAR_TICKERS }}
      RADAR_ASSETS: ${{ vars.RADAR_ASSETS }}
      RADAR_WORKERS: ${{ vars.RADAR_WORKERS }}
      RADAR_ALERT_SCORE: ${{ vars.RADAR_ALERT_SCORE }}
      RADAR_NOTIFY_WATCH: ${{ vars.RADAR_NOTIFY_WATCH }}
      RADAR_MAX_ALERTS: ${{ vars.RADAR_MAX_ALERTS }}
      RADAR_ENTRY_CUTOFF_ET: ${{ vars.RADAR_ENTRY_CUTOFF_ET }}
      RADAR_CAPITAL: ${{ vars.RADAR_CAPITAL }}
      RADAR_RISK_PCT: ${{ vars.RADAR_RISK_PCT }}
      RADAR_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run && 'true' || 'false' }}
      RADAR_SEND_SUMMARY: ${{ github.event_name == 'workflow_dispatch' && inputs.send_summary && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_worker.txt

      - name: Restore trained DAY models
        uses: actions/cache/restore@v4
        with:
          path: .radar_state/models
          key: radar-models-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-models-${{ runner.os }}-

      - name: Prepare model cache directory
        run: mkdir -p .radar_state/models

      - name: Install worker dependencies
        run: python -m pip install -r requirements_worker.txt

      - name: Validate persistent cloud configuration
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID in GitHub repository secrets."
            exit 2
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing DATABASE_URL. Cloud trade/scheduler state must use persistent PostgreSQL."
            exit 4
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*|postgresql+psycopg://*) ;;
            *)
              echo "DATABASE_URL must point to PostgreSQL for the cloud worker."
              exit 4
              ;;
          esac

      - name: Run cloud radar
        run: python cloud_radar.py

      - name: Save trained DAY models
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .radar_state/models
          key: radar-models-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
